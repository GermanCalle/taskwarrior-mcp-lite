[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskwarrior-mcp-lite"
version = "0.1.0"
description = "MCP server and dependency-free Python core for Taskwarrior"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "German Calle", email = "german.callehuamani@gmail.com" }]
keywords = ["taskwarrior", "mcp", "task-management", "cli", "productivity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
server = ["mcp>=2.0,<3"]
dev = ["pytest>=8", "ruff>=0.7"]

[project.urls]
Homepage = "https://github.com/GermanCalle/taskwarrior-mcp-lite"
Repository = "https://github.com/GermanCalle/taskwarrior-mcp-lite"
Issues = "https://github.com/GermanCalle/taskwarrior-mcp-lite/issues"

[project.scripts]
taskwarrior-mcp-lite = "taskwarrior_mcp_lite.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taskwarrior_mcp_lite"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
